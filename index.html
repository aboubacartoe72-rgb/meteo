<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Météo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin: 20px 0; font-weight: 300; letter-spacing: 2px; }
    .search {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 500px;
    }
    .search input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
    }
    .search button {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      background: #ffb703;
      color: #1e3c72;
      font-weight: bold;
      cursor: pointer;
      transition: transform .2s;
    }
    .search button:hover { transform: scale(1.05); }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .city { font-size: 28px; margin-bottom: 5px; }
    .temp { font-size: 72px; font-weight: bold; margin: 10px 0; }
    .icon { font-size: 64px; }
    .desc { font-size: 18px; margin-bottom: 20px; text-transform: capitalize; }
    .details {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255,255,255,0.3);
      padding-top: 20px;
      font-size: 14px;
    }
    .details div { text-align: center; }
    .details span { display: block; font-size: 20px; font-weight: bold; margin-top: 5px; }
    .error { color: #ffb703; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🌍 Ma Météo</h1>

  <div class="search">
    <input type="text" id="cityInput" placeholder="Entrez une ville..." />
    <button onclick="getWeather()">Chercher</button>
  </div>

  <div class="card" id="weatherCard" style="display:none;">
    <div class="city" id="cityName"></div>
    <div class="icon" id="weatherIcon"></div>
    <div class="temp" id="temperature"></div>
    <div class="desc" id="description"></div>
    <div class="details">
      <div>Vent <span id="wind"></span></div>
      <div>Humidité <span id="humidity"></span></div>
    </div>
  </div>

  <div class="error" id="errorMsg"></div>

  <script>
    // Correspondance code météo → icône + description
    const weatherCodes = {
      0: { icon: '☀️', desc: 'ciel dégagé' },
      1: { icon: '🌤️', desc: 'peu nuageux' },
      2: { icon: '⛅', desc: 'partiellement nuageux' },
      3: { icon: '☁️', desc: 'couvert' },
      45: { icon: '🌫️', desc: 'brouillard' },
      48: { icon: '🌫️', desc: 'brouillard givrant' },
      51: { icon: '🌦️', desc: 'bruine légère' },
      61: { icon: '🌧️', desc: 'pluie légère' },
      63: { icon: '🌧️', desc: 'pluie modérée' },
      65: { icon: '🌧️', desc: 'pluie forte' },
      71: { icon: '🌨️', desc: 'neige légère' },
      73: { icon: '🌨️', desc: 'neige modérée' },
      75: { icon: '❄️', desc: 'neige forte' },
      80: { icon: '🌦️', desc: 'averses' },
      95: { icon: '⛈️', desc: 'orage' },
    };

    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;

      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        // 1. Géocodage : ville → latitude/longitude
        const geoRes = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr`
        );
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('Ville introuvable');
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        // 2. Récupération météo
        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
          `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`
        );
        const weatherData = await weatherRes.json();
        const current = weatherData.current;

        // 3. Affichage
        const info = weatherCodes[current.weather_code] || { icon: '❓', desc: 'inconnu' };
        document.getElementById('cityName').textContent = `${name}, ${country}`;
        document.getElementById('weatherIcon').textContent = info.icon;
        document.getElementById('temperature').textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('description').textContent = info.desc;
        document.getElementById('wind').textContent = `${current.wind_speed_10m} km/h`;
        document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
        document.getElementById('weatherCard').style.display = 'block';

      } catch (err) {
        errorMsg.textContent = '❌ ' + err.message;
        document.getElementById('weatherCard').style.display = 'none';
      }
    }

    // Recherche avec la touche Entrée
    document.getElementById('cityInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') getWeather();
    });
  </script>
</body>
</html>
